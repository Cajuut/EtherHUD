plugins {
    id 'fabric-loom' version '1.9.2'
}

group = 'io.github.etherhud'
version = '1.0.0'

repositories {
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4'
    modCompileOnly('com.terraformersmc:modmenu:13.0.3') { transitive = false }
    modCompileOnly('me.shedaniel.cloth:cloth-config-fabric:17.0.144') { transitive = false }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

jar {
    from('LICENSE')
}
